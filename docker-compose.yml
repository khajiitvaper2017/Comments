services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${COMMENTS_DB_PASSWORD:?Set COMMENTS_DB_PASSWORD before starting Docker Compose}"
    ports: ["1433:1433"]
    volumes: [comments-db:/var/opt/mssql]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD-SHELL
        - >
          if ! state=$$(/opt/mssql-tools18/bin/sqlcmd -S localhost -d master -U sa
          -P "$${MSSQL_SA_PASSWORD}" -C -h -1 -W -Q
          "SET NOCOUNT ON; SELECT state_desc FROM sys.databases WHERE name = N'Comments'"); then exit 1; fi;
          if [ -z "$$state" ]; then exit 0; fi;
          [ "$$state" = "ONLINE" ] || exit 1;
          /opt/mssql-tools18/bin/sqlcmd -S localhost -d Comments -U sa
          -P "$${MSSQL_SA_PASSWORD}" -C -b -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports: ["15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes: [comments-search:/usr/share/elasticsearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  app:
    build: .
    environment:
      ConnectionStrings__Comments: "Server=db,1433;Database=Comments;User Id=sa;Password=${COMMENTS_DB_PASSWORD};TrustServerCertificate=True"
      Storage__Root: "/data/uploads"
      ConnectionStrings__Redis: "redis:6379"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__User: "guest"
      RabbitMq__Password: "guest"
      Elasticsearch__Uri: "http://elasticsearch:9200"
      Elasticsearch__Index: "comments"
      Logging__LogLevel__Default: "Warning"
      Logging__LogLevel__Microsoft.AspNetCore: "Warning"
      Logging__LogLevel__Microsoft.EntityFrameworkCore: "Warning"
      Logging__LogLevel__Microsoft.Hosting.Lifetime: "Information"
    expose: ["8080"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':</dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    volumes: [comments-files:/data]
  frontend:
    build: ./Comments.Frontend
    ports: ["8080:80"]
    depends_on:
      app:
        condition: service_healthy
volumes:
  comments-db:
  comments-files:
  comments-search:
