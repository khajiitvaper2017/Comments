<main>
  <header class="page-header">
    <div>
      <p class="eyebrow">
        <a routerLink="/">Community discussion</a>
      </p>
    </div>
    <button class="leave-comment-button" type="button" (click)="openComposer()">
      <ng-icon name="lucideMessageCirclePlus" size="1rem" aria-hidden="true" />
      Leave comment
    </button>
  </header>
  <form class="search-bar" (ngSubmit)="store.submitSearch()">
    <label for="comment-search">
      <span>Search</span>
      <input
        id="comment-search"
        name="searchQuery"
        [ngModel]="store.searchDraft().query"
        (ngModelChange)="store.setSearchQuery($event)"
        placeholder="Search text or user name"
      />
      <span class="partial-search-option">
        <input
          id="partial-search"
          name="partialSearch"
          type="checkbox"
          [ngModel]="store.searchDraft().partial"
          (ngModelChange)="store.setPartialSearch($event)"
        />
        <span>Match partial words</span>
      </span>
      <span class="search-fields">
        <span class="search-field-option">
          <input
            type="checkbox"
            name="searchText"
            aria-label="Search comment text"
            [ngModel]="store.searchDraft().fields.text"
            (ngModelChange)="store.setSearchField('text', $event)"
          />
          <span>Search text</span>
        </span>
        <span class="search-field-option">
          <input
            type="checkbox"
            name="searchUserName"
            aria-label="Search usernames"
            [ngModel]="store.searchDraft().fields.userName"
            (ngModelChange)="store.setSearchField('userName', $event)"
          />
          <span>Search usernames</span>
        </span>
      </span>
      <span class="search-fields">
        <span class="search-field-option">
          <input
            type="checkbox"
            name="searchComments"
            aria-label="Search comments"
            [ngModel]="store.searchDraft().targets.comments"
            (ngModelChange)="store.setSearchTarget('comments', $event)"
          />
          <span>Search comments</span>
        </span>
        <span class="search-field-option">
          <input
            type="checkbox"
            name="searchReplies"
            aria-label="Search replies"
            [ngModel]="store.searchDraft().targets.replies"
            (ngModelChange)="store.setSearchTarget('replies', $event)"
          />
          <span>Search replies</span>
        </span>
      </span>
    </label>
    <button
      class="submit-button"
      type="submit"
      [disabled]="
        store.searchLoading() ||
        !store.searchDraft().query.trim() ||
        (!store.searchDraft().fields.text && !store.searchDraft().fields.userName) ||
        (!store.searchDraft().targets.comments && !store.searchDraft().targets.replies)
      "
    >
      <ng-icon name="lucideSearch" size="1rem" aria-hidden="true" />
      {{ store.searchLoading() ? 'Searching...' : 'Search' }}
    </button>
  </form>
  @if (store.commentsLoading()) {
    <div class="loading-state" role="status" aria-live="polite">
      <span class="loading-spinner" aria-hidden="true"></span><span>Loading comments...</span>
    </div>
  }
  @if (store.composer().kind === 'root') {
    <app-comment-form
      [captcha]="store.captcha()"
      parentId=""
      (captchaChanged)="store.captcha.set($event)"
      (errorChanged)="store.error.set($event)"
      (submitted)="handleSubmitted($event)"
      (cancelled)="cancelComposer()"
    />
  }
  <app-comment-list
    [comments]="store.comments()"
    [nextCursor]="store.nextCursor()"
    [hasPreviousPage]="store.hasPreviousPage()"
    [sort]="store.query().sort.field"
    [descending]="store.query().sort.descending"
    [searchMode]="store.searchActive()"
    [highlightTerm]="store.query().search?.query ?? ''"
    [partialSearch]="store.query().search?.partial ?? false"
    [viewMode]="store.query().viewMode"
    [captcha]="store.captcha()"
    [replyParentId]="store.replyParentId()"
    (sortChanged)="changeSort($event)"
    (pageChanged)="store.changePage($event)"
    (viewModeChanged)="changeViewMode($event)"
    (replyRequested)="setReplyParent($event)"
    (loadRepliesRequested)="store.loadReplies($event)"
    (loadAncestorsRequested)="store.loadAncestors($event)"
    (imageRequested)="store.openImage($event)"
    (textRequested)="store.openText($event)"
    (captchaChanged)="store.captcha.set($event)"
    (errorChanged)="store.error.set($event)"
    (submitted)="handleSubmitted($event)"
    (cancelled)="cancelComposer()"
  />
  @if (store.error()) {
    <p class="error" role="alert">{{ store.error() }}</p>
  }
</main>
<app-image-lightbox [image]="store.selectedImage()" (closed)="store.closePreview()" />
<app-text-preview [text]="store.selectedText()" (closed)="store.closePreview()" />
