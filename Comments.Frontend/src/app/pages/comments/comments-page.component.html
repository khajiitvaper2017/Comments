<main>
  <header class="page-header">
    <div>
      <p class="eyebrow">
        <a routerLink="/">Community discussion</a>
      </p>
    </div>
    <button class="leave-comment-button" type="button" (click)="openComposer()">
      <ng-icon name="lucideMessageCirclePlus" size="1rem" aria-hidden="true" />
      Leave comment
    </button>
  </header>
  <form class="search-bar" (ngSubmit)="search()">
    <label for="comment-search">
      <span>Search</span>
      <input
        id="comment-search"
        name="searchQuery"
        [(ngModel)]="searchQuery"
        placeholder="Search text or user name"
      />
      <span class="partial-search-option">
        <input
          id="partial-search"
          name="partialSearch"
          type="checkbox"
          [(ngModel)]="partialSearch"
        />
        <span>Match partial words</span>
      </span>
      <span class="search-fields">
        <span class="search-field-option">
          <input
            type="checkbox"
            name="searchText"
            aria-label="Search comment text"
            [(ngModel)]="searchText"
          />
          <span>Search text</span>
        </span>
        <span class="search-field-option">
          <input
            type="checkbox"
            name="searchUserName"
            aria-label="Search usernames"
            [(ngModel)]="searchUserName"
          />
          <span>Search usernames</span>
        </span>
      </span>
    </label>
    <button
      class="submit-button"
      type="submit"
      [disabled]="searchLoading() || !searchQuery.trim() || (!searchText && !searchUserName)"
    >
      <ng-icon name="lucideSearch" size="1rem" aria-hidden="true" />
      {{ searchLoading() ? 'Searching...' : 'Search' }}
    </button>
  </form>
  @if (loading()) {
    <div class="loading-state" role="status" aria-live="polite">
      <span class="loading-spinner" aria-hidden="true"></span>
      <span>Loading comments...</span>
    </div>
  }
  @if (showComposer()) {
    <app-comment-form
      [captcha]="captcha()"
      [parentId]="replyParentId"
      (captchaChanged)="captcha.set($event)"
      (errorChanged)="error.set($event)"
      (submitted)="handleSubmitted($event)"
      (cancelled)="cancelComposer()"
    >
    </app-comment-form>
  }
  <app-comment-list
    [comments]="comments()"
    [nextCursor]="nextCursor"
    [hasPreviousPage]="hasPreviousPage"
    [sort]="sort"
    [descending]="descending"
    [searchMode]="searchActive()"
    [highlightTerm]="searchActive() ? activeSearchQuery : ''"
    [partialSearch]="partialSearch"
    [viewMode]="viewMode"
    [captcha]="captcha()"
    [replyParentId]="replyParentId"
    (sortChanged)="changeSort($event)"
    (pageChanged)="changePage($event)"
    (viewModeChanged)="changeViewMode($event)"
    (replyRequested)="setReplyParent($event)"
    (loadRepliesRequested)="loadReplies($event)"
    (loadAncestorsRequested)="loadAncestors($event)"
    (imageRequested)="openImage($event)"
    (textRequested)="openText($event)"
    (captchaChanged)="captcha.set($event)"
    (errorChanged)="error.set($event)"
    (submitted)="handleSubmitted($event)"
    (cancelled)="cancelComposer()"
  >
  </app-comment-list>
  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }
</main>
<app-image-lightbox [image]="selectedImage()" (closed)="closeImage()"></app-image-lightbox>
<app-text-preview [text]="selectedText()" (closed)="closeText()"></app-text-preview>
