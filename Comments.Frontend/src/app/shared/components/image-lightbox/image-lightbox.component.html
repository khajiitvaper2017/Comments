<div
  class="lightbox"
  *ngIf="image"
  (click)="closed.emit()"
  (wheel)="onWheel($event)"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="image.name"
>
  <div class="lightbox-toolbar" (click)="$event.stopPropagation()">
    <button type="button" (click)="zoom(-0.25)" [disabled]="scale === 0.25">−</button
    ><span>{{ scale * 100 | number: '1.0-0' }}%</span
    ><button type="button" (click)="zoom(0.25)" [disabled]="scale === 3">+</button
    ><button type="button" (click)="closed.emit()" aria-label="Close image">×</button>
  </div>
  <img
    [src]="image.url"
    [alt]="image.name"
    [style.transform]="'scale(' + scale + ')'"
    (click)="$event.stopPropagation()"
  />
</div>
