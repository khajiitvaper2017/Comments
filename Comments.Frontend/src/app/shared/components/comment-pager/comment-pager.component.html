@if (total > pageSize) {
  <div class="pager">
    <button type="button" [disabled]="page === 1" (click)="pageChanged.emit(page - 1)">
      Previous
    </button>
    <nav class="page-numbers" aria-label="Comment pages">
      @for (item of pageItems; track $index) {
        @if (item === 'ellipsis') {
          <span class="page-ellipsis" aria-hidden="true">…</span>
        } @else {
          <button
            type="button"
            [class.active]="item === page"
            [attr.aria-current]="item === page ? 'page' : null"
            (click)="pageChanged.emit(item)"
          >
            {{ item }}
          </button>
        }
      }
    </nav>
    <button type="button" [disabled]="page >= pageCount" (click)="pageChanged.emit(page + 1)">
      Next
    </button>
  </div>
}
