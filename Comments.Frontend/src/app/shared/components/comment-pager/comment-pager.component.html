@if (hasPreviousPage || nextCursor) {
  <div class="pager">
    @if (hasPreviousPage) {
      <button type="button" (click)="pageChanged.emit('previous')">Previous Page</button>
    }
    <button type="button" [disabled]="!nextCursor" (click)="pageChanged.emit('next')">
      Next Page
    </button>
  </div>
}
