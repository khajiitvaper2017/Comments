@if (hasPreviousPage || nextCursor) {
  <div class="pager">
    @if (hasPreviousPage) {
      <button (click)="pageChanged.emit('previous')" type="button">
        <ng-icon aria-hidden="true" name="lucideChevronLeft" size="1rem" />
        Previous Page
      </button>
    }
    <button
      (click)="pageChanged.emit('next')"
      [disabled]="!nextCursor"
      type="button">
      Next Page
      <ng-icon aria-hidden="true" name="lucideChevronRight" size="1rem" />
    </button>
  </div>
}
