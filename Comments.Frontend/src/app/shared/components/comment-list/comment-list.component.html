<section class="discussion" aria-labelledby="discussion-title">
  <div class="discussion-heading">
    <h2 id="discussion-title">
      Comments <span>{{ total }}</span>
    </h2>
    <div class="sorter" aria-label="Sort comments">
      <span>Sort by</span>
      <button [class.active]="sort === 'createdAt'" (click)="sortChanged.emit('createdAt')">
        Newest
      </button>
      <button [class.active]="sort === 'userName'" (click)="sortChanged.emit('userName')">
        Name
      </button>
      <button [class.active]="sort === 'email'" (click)="sortChanged.emit('email')">E-mail</button>
    </div>
  </div>
  <p class="empty" *ngIf="!comments.length">No comments yet. Start the discussion below.</p>
  <div class="comment-list" *ngIf="comments.length">
    <ng-container *ngFor="let comment of comments; trackBy: track">
      <ng-template
        [ngTemplateOutlet]="row"
        [ngTemplateOutletContext]="{ comment, depth: 0 }"
      ></ng-template>
    </ng-container>
  </div>
  <div class="pager" *ngIf="total > 25">
    <button [disabled]="page === 1" (click)="pageChanged.emit(page - 1)">Previous</button>
    <span>Page {{ page }}</span>
    <button [disabled]="page * 25 >= total" (click)="pageChanged.emit(page + 1)">Next</button>
  </div>
</section>

<ng-template #row let-comment="comment" let-depth="depth">
  <article class="comment" [class.reply]="depth > 0" [style.--depth]="depth">
    <header class="comment-header">
      <div class="avatar" aria-hidden="true">{{ comment.userName.charAt(0).toUpperCase() }}</div>
      <div class="identity">
        <strong>{{ comment.userName }}</strong>
        <span>{{ comment.createdAtUtc | date: 'dd.MM.yy HH:mm' }}</span>
        <a
          *ngIf="comment.homePage"
          class="homepage"
          [href]="comment.homePage"
          target="_blank"
          rel="noopener"
          >{{ homePageLabel(comment.homePage) }}</a
        >
      </div>
      <button class="reply-button" type="button" (click)="replyRequested.emit(comment.id)">
        Reply
      </button>
    </header>
    <div class="comment-body" [innerHTML]="comment.text"></div>
    <div class="attachments" *ngIf="comment.attachments.length">
      <ng-container *ngFor="let attachment of comment.attachments">
        <button
          *ngIf="attachment.contentType.startsWith('image/'); else fileAttachment"
          class="image-attachment"
          type="button"
          (click)="imageRequested.emit({ id: attachment.id, name: attachment.fileName })"
        >
          <img
            [src]="'/api/attachments/' + attachment.id"
            [alt]="attachment.fileName"
            loading="lazy"
          />
          <span>{{ attachment.fileName }}</span>
        </button>
        <ng-template #fileAttachment
          ><a [href]="'/api/attachments/' + attachment.id" target="_blank" rel="noopener"
            >📎 {{ attachment.fileName }}</a
          ></ng-template
        >
      </ng-container>
    </div>
    <article
      class="comment reply reply-composer"
      *ngIf="replyParentId === comment.id"
      [style.--depth]="depth + 1"
    >
      <app-comment-form
        [captcha]="captcha"
        [parentId]="comment.id"
        [replyToName]="comment.userName"
        (captchaChanged)="captchaChanged.emit($event)"
        (errorChanged)="errorChanged.emit($event)"
        (submitted)="submitted.emit()"
      ></app-comment-form>
    </article>
    <ng-container *ngFor="let child of comment.replies">
      <ng-template
        [ngTemplateOutlet]="row"
        [ngTemplateOutletContext]="{ comment: child, depth: depth + 1 }"
      ></ng-template>
    </ng-container>
  </article>
</ng-template>
