<section aria-labelledby="discussion-title" class="discussion">
  <div class="discussion-heading">
    <h2 id="discussion-title">Comments</h2>
    <div class="discussion-controls">
      @if (viewMode === 'cards' && !searchMode) {
        <div aria-label="Sort comments" class="sorter">
          <span>Sort by</span>
          <button
            (click)="sortChanged.emit('createdAt')"
            [class.active]="sort === 'createdAt'"
            type="button">
            Date
            @if (sort === 'createdAt') {
              {{ descending ? '↓' : '↑' }}
            }
          </button>
          <button
            (click)="sortChanged.emit('userName')"
            [class.active]="sort === 'userName'"
            type="button">
            Name
            @if (sort === 'userName') {
              {{ descending ? '↓' : '↑' }}
            }
          </button>
          <button
            (click)="sortChanged.emit('email')"
            [class.active]="sort === 'email'"
            type="button">
            E-mail
            @if (sort === 'email') {
              {{ descending ? '↓' : '↑' }}
            }
          </button>
        </div>
      }
      @if (!searchMode) {
        <div aria-label="Comment view" class="view-switch" role="group">
          <button
            (click)="setViewMode('cards')"
            [class.active]="viewMode === 'cards'"
            aria-label="Card view"
            title="Card view"
            type="button">
            <ng-icon aria-hidden="true" name="lucideList" size="1rem" />
          </button>
          <button
            (click)="setViewMode('table')"
            [class.active]="viewMode === 'table'"
            aria-label="Table view"
            title="Table view"
            type="button">
            <ng-icon aria-hidden="true" name="lucideTable2" size="1rem" />
          </button>
        </div>
      }
    </div>
  </div>

  <app-comment-pager
    (pageChanged)="pageChanged.emit($event)"
    [hasPreviousPage]="hasPreviousPage"
    [nextCursor]="nextCursor" />

  @if (!comments.length) {
    <p class="empty">No comments yet. Start the discussion below.</p>
  } @else if (viewMode === 'cards') {
    <app-comment-cards
      (cancelled)="cancelled.emit()"
      (captchaChanged)="captchaChanged.emit($event)"
      (errorChanged)="errorChanged.emit($event)"
      (imageRequested)="imageRequested.emit($event)"
      (loadAncestorsRequested)="loadAncestorsRequested.emit($event)"
      (loadRepliesRequested)="loadRepliesRequested.emit($event)"
      (replyRequested)="replyRequested.emit($event)"
      (submitted)="submitted.emit($event)"
      (textRequested)="textRequested.emit($event)"
      [captcha]="captcha"
      [comments]="comments"
      [highlightComments]="highlightComments"
      [highlightReplies]="highlightReplies"
      [highlightTerm]="highlightTerm"
      [highlightText]="highlightText"
      [highlightUserName]="highlightUserName"
      [partialSearch]="partialSearch"
      [replyParentId]="replyParentId"
      [searchMode]="searchMode" />
  } @else {
    <app-comment-table
      (imageRequested)="imageRequested.emit($event)"
      (sortChanged)="sortChanged.emit($event)"
      (textRequested)="textRequested.emit($event)"
      [comments]="comments"
      [descending]="descending"
      [sort]="sort" />
  }

  <div class="discussion-footer">
    <app-comment-pager
      (pageChanged)="pageChanged.emit($event)"
      [hasPreviousPage]="hasPreviousPage"
      [nextCursor]="nextCursor" />
  </div>
</section>
