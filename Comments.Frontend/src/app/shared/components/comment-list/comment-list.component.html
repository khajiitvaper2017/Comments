<section class="discussion" aria-labelledby="discussion-title">
  <div class="discussion-heading">
    <h2 id="discussion-title">Comments</h2>
    <div class="discussion-controls">
      @if (viewMode === 'cards') {
        <div class="sorter" aria-label="Sort comments">
          <span>Sort by</span>
          <button
            type="button"
            [class.active]="sort === 'createdAt'"
            (click)="sortChanged.emit('createdAt')"
          >
            Date
            @if (sort === 'createdAt') {
              {{ descending ? '↓' : '↑' }}
            }
          </button>
          <button
            type="button"
            [class.active]="sort === 'userName'"
            (click)="sortChanged.emit('userName')"
          >
            Name
            @if (sort === 'userName') {
              {{ descending ? '↓' : '↑' }}
            }
          </button>
          <button
            type="button"
            [class.active]="sort === 'email'"
            (click)="sortChanged.emit('email')"
          >
            E-mail
            @if (sort === 'email') {
              {{ descending ? '↓' : '↑' }}
            }
          </button>
        </div>
      }
      <div class="view-switch" role="group" aria-label="Comment view">
        <button
          type="button"
          title="Card view"
          aria-label="Card view"
          [class.active]="viewMode === 'cards'"
          (click)="setViewMode('cards')"
        >
          <ng-icon name="lucideList" size="1rem" aria-hidden="true" />
        </button>
        <button
          type="button"
          title="Table view"
          aria-label="Table view"
          [class.active]="viewMode === 'table'"
          (click)="setViewMode('table')"
        >
          <ng-icon name="lucideTable2" size="1rem" aria-hidden="true" />
        </button>
      </div>
    </div>
  </div>

  @if (!comments.length) {
    <p class="empty">No comments yet. Start the discussion below.</p>
  } @else if (viewMode === 'cards') {
    <app-comment-cards
      [comments]="comments"
      [captcha]="captcha"
      [replyParentId]="replyParentId"
      (replyRequested)="replyRequested.emit($event)"
      (imageRequested)="imageRequested.emit($event)"
      (captchaChanged)="captchaChanged.emit($event)"
      (errorChanged)="errorChanged.emit($event)"
      (submitted)="submitted.emit()"
      (cancelled)="cancelled.emit()"
    />
  } @else {
    <app-comment-table
      [comments]="comments"
      [sort]="sort"
      [descending]="descending"
      [captcha]="captcha"
      [replyParentId]="replyParentId"
      (sortChanged)="sortChanged.emit($event)"
      (replyRequested)="replyRequested.emit($event)"
      (imageRequested)="imageRequested.emit($event)"
      (captchaChanged)="captchaChanged.emit($event)"
      (errorChanged)="errorChanged.emit($event)"
      (submitted)="submitted.emit()"
      (cancelled)="cancelled.emit()"
    />
  }

  @if (total > 25) {
    <div class="pager">
      <button type="button" [disabled]="page === 1" (click)="pageChanged.emit(page - 1)">
        Previous
      </button>
      <span>Page {{ page }}</span>
      <button type="button" [disabled]="page * 25 >= total" (click)="pageChanged.emit(page + 1)">
        Next
      </button>
    </div>
  }
</section>
